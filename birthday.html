<!DOCTYPE html>
<html lang="en">

<head>
    <title>birthday card</title>
    <link rel="stylesheet" href="birth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>
<div class="card">
    <h1>🥳Today is Tifah's Birthday 🎉</h1>
    <div id="image">
        <img src="Capture.PNG">
    </div>
    <div class="age">
        <h2 id="age">20 years old</h2>
    </div>
    <div class="date">
        <h4 id="date">12.11.2006</h4>
    </div>
</div>
<div class="gift-section">
    <h2 class="gift-title">Here's how happy I am for you today 🥳</h2>
    <h3 class="gift-hint">(Hover over the gift)</h3>
    <div class="gift"></div>
</div>
<div class="react-section">
    <h2 class="react">Here is how people react when you enter the</h2>
    <h3 class="room">room 🥰</h3>
    <div class="reaction"></div>
</div>
<div class="pre-last">
    <h2 class="genius">If I had to describe you with ONE word 👇</h2>
    <div class="geni"></div>
</div>
<div class="pre-last">
    <h2 class="genius">The only person as badass as you 💪</h2>
    <div class="last"></div>
</div>
<div id="pre-last">
    <h2 id="genius">This one's for <em>you</em>, my Love 🥂</h2>
    <div id="last"></div>
    <h3>From: KJB</h3>
</div>

<body>

</body>

</html>
